robot/panda:
  joint_state_controller:
    type: joint_state_controller/JointStateController
    publish_rate: 50

  joint1_position_controller:
    type: effort_controllers/JointPositionController
    joint: panda_joint1
    pid: { p: 600.0, i: 0.01, d: 30.0 }
  joint2_position_controller:
    type: effort_controllers/JointPositionController
    joint: panda_joint2
    pid: { p: 600.0, i: 0.01, d: 30.0 }
  joint3_position_controller:
    type: effort_controllers/JointPositionController
    joint: panda_joint3
    pid: { p: 600.0, i: 0.01, d: 30.0 }
  joint4_position_controller:
    type: effort_controllers/JointPositionController
    joint: panda_joint4
    pid: { p: 600.0, i: 0.01, d: 30.0 }
  joint5_position_controller:
    type: effort_controllers/JointPositionController
    joint: panda_joint5
    pid: { p: 250.0, i: 0.01, d: 10.0 }
  joint6_position_controller:
    type: effort_controllers/JointPositionController
    joint: panda_joint6
    pid: { p: 150.0, i: 0.01, d: 10.0 }
  joint7_position_controller:
    type: effort_controllers/JointPositionController
    joint: panda_joint7
    pid: { p: 50.0, i: 0.01, d: 5.0 }

    # values have been taken from the pandas file

  whole_body_controller:
    type: effort_controllers/JointTrajectoryController
    joints:
      - odom_x
      - odom_y
      - odom_r
      - panda_joint1
      - panda_joint2
      - panda_joint3
      - panda_joint4
      - panda_joint5
      - panda_joint6
      - panda_joint7
    constraints:
      goal_time: 0.6
      stopped_velocity_tolerance: 0.01
      #head:
      #  max_velocity: 1.0
      #  max_acceleration: 1.0
      #  max_jerk: 1.0
    gains:
      odom_x: { p: 100.0, i: 0.01, d: 10.0 } #previous p value = 100
      odom_y: { p: 100.0, i: 0.01, d: 10.0 }
      odom_r: { p: 100.0, i: 0.01, d: 10.0 }
      panda_joint1: { p: 600.0, i: 0.01, d: 30.0 }
      panda_joint2: { p: 600.0, i: 0.01, d: 30.0 }
      panda_joint3: { p: 600.0, i: 0.01, d: 30.0 }
      panda_joint4: { p: 600.0, i: 0.01, d: 30.0 }
      panda_joint5: { p: 250.0, i: 0.01, d: 10.0 }
      panda_joint6: { p: 150.0, i: 0.01, d: 10.0 }
      panda_joint7: { p: 50.0, i: 0.01, d: 5.0 }

gazebo_ros_control/pid_gains:
  panda_joint1: { p: 600.0, i: 0.01, d: 30.0 }
  panda_joint2: { p: 600.0, i: 0.01, d: 30.0 }
  panda_joint3: { p: 600.0, i: 0.01, d: 30.0 }
  panda_joint4: { p: 600.0, i: 0.01, d: 30.0 }
  panda_joint5: { p: 250.0, i: 0.01, d: 10.0 }
  panda_joint6: { p: 150.0, i: 0.01, d: 10.0 }

  panda_joint7: { p: 50.0, i: 0.01, d: 5.0 }
