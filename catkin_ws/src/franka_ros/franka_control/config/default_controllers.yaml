position_joint_trajectory_controller:
  type: position_controllers/JointTrajectoryController
  joints:
    - robot__joint1
    - robot__joint2
    - robot__joint3
    - robot__joint4
    - robot__joint5
    - robot__joint6
    - robot__joint7
  constraints:
    goal_time: 0.5
    robot__joint1: { goal: 0.05 }
    robot__joint2: { goal: 0.05 }
    robot__joint3: { goal: 0.05 }
    robot__joint4: { goal: 0.05 }
    robot__joint5: { goal: 0.05 }
    robot__joint6: { goal: 0.05 }
    robot__joint7: { goal: 0.05 }

effort_joint_trajectory_controller:
  type: effort_controllers/JointTrajectoryController
  joints:
    - robot__joint1
    - robot__joint2
    - robot__joint3
    - robot__joint4
    - robot__joint5
    - robot__joint6
    - robot__joint7
  gains:
    robot__joint1: { p: 600, d: 30, i: 0 }
    robot__joint2: { p: 600, d: 30, i: 0 }
    robot__joint3: { p: 600, d: 30, i: 0 }
    robot__joint4: { p: 600, d: 30, i: 0 }
    robot__joint5: { p: 250, d: 10, i: 0 }
    robot__joint6: { p: 150, d: 10, i: 0 }
    robot__joint7: { p: 50, d: 5, i: 0 }
  constraints:
    goal_time: 0.5
    robot__joint1: { goal: 0.05 }
    robot__joint2: { goal: 0.05 }
    robot__joint3: { goal: 0.05 }
    robot__joint4: { goal: 0.05 }
    robot__joint5: { goal: 0.05 }
    robot__joint6: { goal: 0.05 }
    robot__joint7: { goal: 0.05 }

franka_state_controller:
  type: franka_control/FrankaStateController
  arm_id: robot_
  publish_rate: 30 # [Hz]
  joint_names:
    - robot__joint1
    - robot__joint2
    - robot__joint3
    - robot__joint4
    - robot__joint5
    - robot__joint6
    - robot__joint7
